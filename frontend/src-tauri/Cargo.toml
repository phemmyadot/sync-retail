[package]
name = "sync-retail"
version = "1.1.0"
description = "Sync Retail — cloud-native point of sale"
license = "AGPL-3.0-only"
edition = "2021"

[lib]
name = "sync_retail_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
mdns-sd = "0.13"
keyring = { version = "3", features = ["windows-native"] }
tauri-plugin-autostart = "2"
tauri-plugin-single-instance = "2"
argon2 = "0.5"
password-hash = { version = "0.5", features = ["getrandom"] }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = ["Win32_Foundation", "Win32_UI_WindowsAndMessaging", "Win32_UI_Input_KeyboardAndMouse", "Win32_System_Threading", "Win32_System_LibraryLoader"] }

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
