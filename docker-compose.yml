name: sync-retail

services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB:-sync_retail}
      POSTGRES_INITDB_ARGS: --encoding=UTF8 --locale=C.UTF-8
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      # Exposed on the host for `npm run dev`, Prisma Studio, psql, etc.
      - "${DB_HOST_PORT:-5433}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build:
      context: .
      dockerfile: backend/Dockerfile
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-sync_retail}?schema=public
      JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET in .env}
      PORT: 4000
      CORS_ORIGIN: ${CORS_ORIGIN:-http://localhost:8080,http://tauri.localhost,tauri://localhost}
      SESSION_TTL: ${SESSION_TTL:-12h}
      OVERRIDE_TTL_SECONDS: ${OVERRIDE_TTL_SECONDS:-300}
      SEED_DEMO_DATA: ${SEED_DEMO_DATA:-true}
      # Fresh install without demo data: allow the owner setup wizard through nginx (not just localhost).
      SETUP_ALLOW_REMOTE: ${SETUP_ALLOW_REMOTE:-false}
    ports:
      # Direct API access (desktop/Tauri builds can point VITE_API_URL here).
      - "${API_HOST_PORT:-4000}:4000"

  web:
    build:
      context: .
      dockerfile: frontend/Dockerfile
      args:
        VITE_TERMINAL_ID: ${VITE_TERMINAL_ID:-T1}
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy
    ports:
      - "${WEB_PORT:-8080}:80"

volumes:
  pgdata:
